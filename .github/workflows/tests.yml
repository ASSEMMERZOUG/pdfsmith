name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build the examples
        run: |
          python examples/minimal.py /tmp/minimal.pdf
          python examples/pentest_report.py /tmp/pentest.pdf
          python -m pdfsmith examples/report.json -o /tmp/report.pdf

      - name: Check the PDFs
        run: |
          python -m pdfsmith.check /tmp/minimal.pdf
          python -m pdfsmith.check /tmp/pentest.pdf
          python -m pdfsmith.check /tmp/report.pdf
